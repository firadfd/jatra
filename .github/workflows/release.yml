name: Release

# Publishing a tag on main cuts a release. Tags are `v<version>` and must
# match the version in pubspec.yaml — the job checks, because a mismatch
# ships an APK whose in-app "about" screen and backup files disagree with
# the download page.
#
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write # needed to create the release and upload assets

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag and check it is on main
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          # A tag cut from a side branch would publish code that never passed
          # review on main.
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::Tag $TAG is not an ancestor of main. Only tags on main are released."
            exit 1
          fi

      - name: Check the tag matches pubspec.yaml
        run: |
          PUBSPEC=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          TAG_VERSION="${{ steps.meta.outputs.version }}"
          if [ "$PUBSPEC" != "$TAG_VERSION" ]; then
            echo "::error::Tag is v$TAG_VERSION but pubspec.yaml says $PUBSPEC. Bump one to match the other."
            exit 1
          fi

      # Without these the Gradle config silently falls back to the debug
      # keystore, producing an APK that cannot be upgraded over a real
      # install. Better to stop here than to publish one.
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See CONTRIBUTING.md → Cutting a release for how to generate the keystore and add the four repository secrets."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # The release build is the one users install, so it does not get to
      # skip the suite.
      - name: Test
        run: flutter test --reporter=github

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/jatra-release.jks
          cat > android/key.properties <<EOF
          storeFile=jatra-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Split by ABI: each is ~26 MB, where the universal APK is ~70 MB
      # because it carries the native SQLite and geolocator binaries for
      # every architecture.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      # The universal APK is the one to hand someone who does not know or
      # care what an ABI is. Built after the splits, which it does not
      # disturb — the two write different filenames.
      - name: Build universal APK
        run: flutter build apk --release

      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Collect and name artifacts
        id: artifacts
        run: |
          V="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/jatra-$V-$abi.apk"
          done
          cp build/app/outputs/flutter-apk/app-release.apk "dist/jatra-$V-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/jatra-$V.aab"
          # Sideloaded APKs are downloaded over plain HTTPS from a page
          # anyone can mirror; publish hashes so an install can be verified.
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          ls -la dist

      - name: Always clean up signing material
        if: always()
        run: rm -f android/jatra-release.jks android/key.properties

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Jatra ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          files: dist/*
          body: |
            ## Install

            **Not sure which to pick? Take
            `jatra-${{ steps.meta.outputs.version }}-universal.apk`.** It
            works on every phone. The per-ABI builds are a third of the size
            if you know your architecture.

            | File | For | Size |
            |---|---|---|
            | `jatra-${{ steps.meta.outputs.version }}-universal.apk` | **Any phone — pick this if unsure** | ~70 MB |
            | `jatra-${{ steps.meta.outputs.version }}-arm64-v8a.apk` | Essentially every phone sold since 2017 | ~27 MB |
            | `jatra-${{ steps.meta.outputs.version }}-armeabi-v7a.apk` | Older 32-bit devices | ~25 MB |
            | `jatra-${{ steps.meta.outputs.version }}-x86_64.apk` | Emulators, x86 tablets | ~29 MB |
            | `jatra-${{ steps.meta.outputs.version }}.aab` | Play Store upload — not installable directly | — |

            If a per-ABI install fails with "app not installed", you picked
            the wrong architecture — use the universal one.

            Verify your download against `SHA256SUMS.txt`:

            ```sh
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            Upgrading over a previous release keeps your data. Jatra stores
            everything on-device, so **uninstalling deletes it** — export a
            backup from Settings first.
