name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A force-push or a quick follow-up commit should cancel the run it
# superseded rather than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  analyse:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse
        run: flutter analyze --fatal-infos

      # Drift's query layer and the .arb localisations are generated but
      # committed, so a stale checkout compiles against yesterday's schema.
      # Regenerate and fail if anything moved — that means someone edited a
      # table or a string without re-running codegen.
      - name: Verify generated code is current
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --exit-code --stat; then
            echo "::error::Generated code is out of date. Run 'dart run build_runner build --delete-conflicting-outputs' and 'flutter gen-l10n', then commit the result."
            exit 1
          fi

      - name: Test
        run: flutter test --reporter=github

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: analyse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Proves the Android toolchain still assembles — desugaring, the Drift
      # native libraries and the geolocator foreground service all fail here
      # rather than in a release tag if something regresses.
      - name: Build debug APK
        run: flutter build apk --debug
