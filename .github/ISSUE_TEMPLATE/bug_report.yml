name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please **do not attach a backup file** — it contains your full
        history. Describe the shape of the problem, or redact.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Logged a fill at 12,340 km
        2. Opened Stats
        3. Cost per km showed ৳0.00 instead of a real figure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 6a, Android 14"
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: How did you install it?
      options:
        - APK from a GitHub release
        - Built from source
        - Play Store
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, or the numbers involved if it is a calculation bug.
    validations:
      required: false
